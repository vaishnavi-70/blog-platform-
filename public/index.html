<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f9f9f9; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background-color: #007bff; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
        .post-card { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .post-title { color: #333; text-decoration: none; font-size: 1.5em; font-weight: bold; }
        .author { color: #775; font-size: 0.9em; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>My Blog Platform</h1>
        <a href="/create.html" class="btn">Create New Post</a>
    </header>

    <main id="postsContainer">
        <p>Loading posts...</p>
    </main>

    <script>
        async function fetchPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                const container = document.getElementById('postsContainer');
                
                container.innerHTML = '';
                if (posts.length === 0) {
                    container.innerHTML = '<p>No posts available.</p>';
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <a href="/post.html?id=${post.id}" class="post-title">${post.title}</a>
                        <div class="author">By ${post.author}</div>
                        <p>${post.content.substring(0, 100)}...</p>
                        <a href="/post.html?id=${post.id}" class="btn" style="font-size: 0.8em; padding: 5px 10px;">Read More & Comments (${post.comments.length})</a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }
        fetchPosts();
    </script>
</body>
</html>
